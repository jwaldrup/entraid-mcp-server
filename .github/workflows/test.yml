name: tests

on:
  push:
  pull_request:

jobs:
  wire-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run wire-level guards
        run: uv run python -m pytest -v -p no:cacheprovider
